<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pukka Sahib</title>
<meta name="description" content="A tragicomic year as District Magistrate &amp; Collector of Chhota Nagra, 1920s British India. Keep the peace. Bring in the revenue. And whatever else is lost, keep up appearances. Survive the posting; perhaps a knighthood.">
<meta property="og:title" content="Pukka Sahib">
<meta property="og:description" content="A tragicomic year as District Magistrate &amp; Collector of Chhota Nagra, 1920s British India. Keep the peace. Bring in the revenue. And whatever else is lost, keep up appearances.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://adventuresahib.com/">
<meta property="og:image" content="https://adventuresahib.com/assets/cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#ddd0af; --surface:#ece3c9; --surface2:#e3d8ba;
    --ink:#231f17; --ink-soft:#5b5340; --line:#b9a373; --line-soft:#c9b585;
    --seal:#8f2f22; --seal-ink:#8f2f22; --indigo:#2f3d5c;
    --good:#4a6b3f; --warn:#977326; --bad:#8f2f22;
    --stamp:#8f2f22; --shadow:rgba(90,70,30,.18);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#181510; --surface:#241f18; --surface2:#2b2519;
      --ink:#e9ddc0; --ink-soft:#a89c7f; --line:#4a4130; --line-soft:#574c37;
      --seal:#cf5a45; --seal-ink:#d8654f; --indigo:#93a7cd;
      --good:#82a86f; --warn:#c9a752; --bad:#cf5a45; --stamp:#cf5a45; --shadow:rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#ddd0af; --surface:#ece3c9; --surface2:#e3d8ba;
    --ink:#231f17; --ink-soft:#5b5340; --line:#b9a373; --line-soft:#c9b585;
    --seal:#8f2f22; --seal-ink:#8f2f22; --indigo:#2f3d5c;
    --good:#4a6b3f; --warn:#977326; --bad:#8f2f22; --stamp:#8f2f22; --shadow:rgba(90,70,30,.18);
  }
  :root[data-theme="dark"]{
    --bg:#181510; --surface:#241f18; --surface2:#2b2519;
    --ink:#e9ddc0; --ink-soft:#a89c7f; --line:#4a4130; --line-soft:#574c37;
    --seal:#cf5a45; --seal-ink:#d8654f; --indigo:#93a7cd;
    --good:#82a86f; --warn:#c9a752; --bad:#cf5a45; --stamp:#cf5a45; --shadow:rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    color:var(--ink); background:var(--bg);
    background-image:radial-gradient(rgba(120,95,45,.05) 1px,transparent 1.4px);
    background-size:5px 5px;
    display:flex; min-height:100vh; align-items:flex-start; justify-content:center;
    padding:26px 14px 64px; line-height:1.6;
  }
  .frame{width:100%; max-width:680px; position:relative}

  .masthead{display:flex; gap:16px; align-items:center; margin-bottom:4px}
  /* Sound toggle: a quiet raga in the masthead corner. Struck-through when off. */
  .audiobtn{
    flex:0 0 auto; margin-left:auto; align-self:flex-end; cursor:pointer;
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface2); color:var(--seal); position:relative;
    display:flex; align-items:center; justify-content:center; font-size:1rem; line-height:1;
  }
  @media (max-width:520px){ .audiobtn{align-self:center} }
  .audiobtn:hover{border-color:var(--seal)}
  .audiobtn:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
  .audiobtn.off{color:var(--ink-soft)}
  .audiobtn.off::after{
    content:""; position:absolute; left:6px; right:6px; top:50%; height:1.5px;
    background:var(--ink-soft); transform:rotate(-20deg);
  }
  .seal-svg{flex:0 0 auto; width:62px; height:62px; transform:rotate(-4deg); opacity:.92}
  /* Raster crest (art/web/seal.png, white knocked out to alpha). Replaces the
     inline SVG when the art manifest carries it; the SVG stays as fallback.
     Dark themes lift the inks so the stamp still reads on the dark ground. */
  .crest{flex:0 0 auto; width:66px; height:66px; object-fit:contain; transform:rotate(-4deg); opacity:.94}
  @media (prefers-color-scheme:dark){ .crest{filter:brightness(1.85) saturate(.85)} }
  :root[data-theme="dark"] .crest{filter:brightness(1.85) saturate(.85)}
  :root[data-theme="light"] .crest{filter:none}
  .mast-text{flex:1 1 auto}
  .dept{
    font-family:"Courier New",Courier,monospace; font-size:.62rem;
    letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft);
  }
  h1{font-size:clamp(1.9rem,6vw,2.5rem); margin:1px 0 2px; letter-spacing:.02em; font-weight:600; text-wrap:balance}
  .sub{font-style:italic; color:var(--ink-soft); font-size:.86rem; text-wrap:balance}
  .rule{height:0; border:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:14px 0 16px; padding-top:2px}

  .seasonband{
    display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap;
    font-family:"Courier New",Courier,monospace; font-size:.64rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); margin:0 0 14px;
  }
  .seasonband .glyph{font-size:.95rem; opacity:.85}
  .seasonband b{color:var(--ink); font-weight:700}

  .scene{display:block; width:100%; height:auto; border-radius:5px; border:1px solid var(--line); margin:0 0 14px; box-shadow:0 6px 18px -14px var(--shadow)}
  .start{text-align:center}
  .start img{width:100%; height:auto; border-radius:6px; border:1px solid var(--line); box-shadow:0 8px 26px -16px var(--shadow); margin-bottom:18px}
  .start .tagline{font-style:italic; color:var(--ink-soft); margin:0 auto 20px; max-width:54ch; font-size:1.04rem}

  .meters{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:0 0 14px}
  .meter{background:var(--surface2); border:1px solid var(--line); border-radius:3px; padding:8px 5px 7px; text-align:center}
  .meter .name{font-family:"Courier New",Courier,monospace; font-size:.58rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft)}
  .meter .bar{position:relative; height:6px; background:rgba(120,95,45,.22); border-radius:2px; margin:7px 0 5px; overflow:hidden}
  .meter .fill{height:100%; width:50%; background:var(--warn); transition:width .45s ease, background .45s ease}
  /* The danger floor: a hairline where the meter falls into peril (scandal for
     prestige/order, the warning band near collapse for health/revenue). */
  .meter .floor{position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--bad); opacity:.55; z-index:1}
  .meter .val{font-size:.9rem; font-weight:700; font-variant-numeric:tabular-nums}
  /* Trend since the fortnight opened, and the red ink of a meter in peril. */
  .meter .trend{font-family:"Courier New",Courier,monospace; font-size:.56rem; font-weight:600; letter-spacing:0; margin-left:3px; color:var(--ink-soft); vertical-align:1px}
  .meter.danger .val{color:var(--bad)}
  .meter.danger{border-color:var(--bad)}
  .meter.pulse{animation:pulse .5s}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}

  /* Meter legend: a quiet toggle under the meters, and the glosses it reveals. */
  .meterkey{
    display:block; margin:0 auto 10px; background:none; border:none; cursor:pointer;
    font-family:"Courier New",Courier,monospace; font-size:.6rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-soft); text-decoration:underline dotted;
  }
  .meterkey:hover{color:var(--seal)}
  .meterkey:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
  .legend{
    list-style:none; margin:0 0 14px; padding:12px 14px; background:var(--surface2);
    border:1px solid var(--line); border-radius:4px; font-size:.86rem; line-height:1.5;
  }
  .legend li{margin:0 0 7px} .legend li:last-child{margin:0}
  .legend b{color:var(--seal-ink)}

  .honours{
    font-family:"Courier New",Courier,monospace; font-size:.66rem; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-soft); text-align:center; margin:0 0 4px;
  }
  .honours b{color:var(--seal); font-weight:700}
  .economy{
    font-family:"Courier New",Courier,monospace; font-size:.66rem; letter-spacing:.04em;
    text-transform:uppercase; color:var(--ink-soft); text-align:center;
    margin:0 0 16px; padding-bottom:12px; border-bottom:1px dotted var(--line);
    font-variant-numeric:tabular-nums;
  }
  .economy .debt{color:var(--bad)}
  /* Where you stand with the district's people: shown only once a relationship
     is made. Won reads green, crossed reads oxblood — the standing at a glance. */
  .standings{margin:0 0 16px}
  .standings-head{
    font-family:"Courier New",Courier,monospace; font-size:.6rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-soft); text-align:center; margin-bottom:7px;
  }
  .standing{font-size:.8rem; text-align:center; line-height:1.55}
  .standing .nm{color:var(--ink); font-weight:600}
  .standing .who{color:var(--ink-soft); font-style:italic}
  .standing .st{font-family:"Courier New",Courier,monospace; font-size:.68rem; letter-spacing:.03em}
  .standing.won .st{color:var(--good)}
  .standing.wronged .st{color:var(--bad)}
  /* The year strip: the whole posting as a calendar above the card. A tick per
     fortnight, tinted by season; the current one raised; occasions ahead as
     oxblood seals, past ones faded. Purely a read of the calendar. */
  .yearstrip{margin:2px 0 14px; padding-top:9px}
  .yr-track{display:flex; gap:2px; align-items:flex-end; height:20px}
  .yr-tick{
    position:relative; flex:1 1 0; height:7px; border-radius:1px;
    background:var(--line-soft); opacity:.75; transition:height .2s, opacity .2s;
  }
  .yr-tick.season-cold{background:rgba(120,150,190,.75)}
  .yr-tick.season-hot{background:rgba(200,160,80,.8)}
  .yr-tick.season-monsoon{background:rgba(105,140,115,.8)}
  .yr-tick.past{opacity:.32}
  .yr-tick.now{height:17px; opacity:1; box-shadow:0 0 0 1.5px var(--ink)}
  .yr-seal{
    position:absolute; left:50%; top:-8px; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%; background:var(--seal); border:1px solid var(--bg);
  }
  .yr-seal.past{background:var(--ink-soft); opacity:.5}
  .notice{
    font-family:"Courier New",Courier,monospace; font-size:.72rem; line-height:1.5;
    color:var(--ink); background:var(--surface2); border:1px solid var(--line);
    border-left:3px solid var(--seal); border-radius:3px; padding:9px 12px; margin:0 0 14px;
  }

  .card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:22px 22px 18px; box-shadow:0 1px 0 var(--line), 0 6px 18px -12px var(--shadow)}
  /* Document theatre: the card dressed as the paper it is. */
  .card--telegram{border-style:double; border-width:3px}
  .card--telegram::before{
    content:"\27F6  BY TELEGRAPH  \27F5"; display:block;
    font-family:"Courier New",Courier,monospace; font-size:.58rem; letter-spacing:.2em;
    text-align:center; color:var(--ink-soft); border-bottom:1px dashed var(--line);
    padding-bottom:9px; margin:0 0 13px;
  }
  .card--secret{border-color:var(--stamp)}
  .card--secret::before{
    content:""; display:block; height:3px; margin:-22px -22px 16px; border-radius:5px 5px 0 0;
    background:repeating-linear-gradient(90deg, var(--stamp) 0 11px, transparent 11px 17px); opacity:.6;
  }
  .turnline{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px}
  .fortnight{font-family:"Courier New",Courier,monospace; font-size:.68rem; letter-spacing:.06em; color:var(--ink-soft); text-transform:uppercase; padding-top:4px}
  .stamp{
    flex:0 0 auto; font-family:"Courier New",Courier,monospace; font-size:.62rem;
    letter-spacing:.08em; text-transform:uppercase; color:var(--stamp);
    border:1.5px solid var(--stamp); border-radius:3px; padding:3px 8px;
    transform:rotate(2.5deg); opacity:.88; white-space:nowrap;
  }
  .stamp--secret{background:var(--stamp); color:var(--surface); border-color:var(--stamp); opacity:.92}
  /* The season marker is not a classification: an indigo tab, flat and unrotated,
     so it never reads as another oxblood rubber stamp beside the tag/secrecy ones. */
  .seasontag{
    flex:0 0 auto; font-family:"Courier New",Courier,monospace; font-size:.62rem;
    letter-spacing:.08em; text-transform:uppercase; color:var(--surface);
    background:var(--indigo); border-radius:11px; padding:3px 10px;
    white-space:nowrap; opacity:.9;
  }
  .cover-stamp{
    position:absolute; top:-4px; right:0;
    font-family:"Courier New",Courier,monospace; font-size:.64rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--seal); border:2px solid var(--seal);
    border-radius:3px; padding:4px 9px; transform:rotate(7deg); opacity:.58;
    box-shadow:0 0 0 3px var(--bg); pointer-events:none;
  }
  @media (max-width:520px){ .cover-stamp{display:none} }
  .cardtitle{font-size:1.32rem; margin:0 0 11px; color:var(--seal-ink); font-weight:600; text-wrap:balance}
  .body{font-size:1.02rem; margin-bottom:18px}
  /* The lead of a two-step follow-up: what the first move set in motion. */
  .steplead{font-style:italic; color:var(--ink-soft); margin:0 0 12px; padding-left:12px; border-left:2px solid var(--seal)}
  .choices{display:flex; flex-direction:column; gap:10px}
  button.choice{
    position:relative; overflow:hidden;
    text-align:left; font-family:inherit; font-size:.98rem; color:var(--ink);
    background:var(--surface2); border:1px solid var(--line); border-radius:4px;
    padding:12px 14px; cursor:pointer; transition:.15s; line-height:1.45;
  }
  button.choice:hover{border-color:var(--seal); transform:translateX(3px)}
  button.choice:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
  button.choice.stamped{border-color:var(--stamp)}
  /* A public-works option: a deliberate spend, marked apart from the postures. */
  button.choice--works{border-style:dashed}
  /* Pressing the luck on tour: a warm dashed border marks the gamble. */
  button.choice--press{border-style:dashed; border-color:var(--warn)}
  button.choice--press:hover{border-color:var(--seal)}
  /* The verdict stamped across the chosen option: the decision as an act of
     government, slammed down and slightly askew, in the oxblood office ink. */
  .choice .verdict-stamp{
    position:absolute; top:50%; right:16px; transform:translateY(-50%) rotate(-9deg);
    font-family:"Courier New",Courier,monospace; font-weight:700; font-size:1.05rem;
    letter-spacing:.1em; text-transform:uppercase; color:var(--stamp);
    border:2.5px solid var(--stamp); border-radius:4px; padding:2px 9px;
    opacity:.9; pointer-events:none; animation:stampSlam .28s cubic-bezier(.2,1.4,.5,1) both;
  }
  @keyframes stampSlam{
    0%{transform:translateY(-50%) rotate(-9deg) scale(2.5); opacity:0}
    55%{opacity:.95} 100%{transform:translateY(-50%) rotate(-9deg) scale(1); opacity:.9}
  }
  @keyframes slidein{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
  .outcome.slidein{animation:slidein .32s ease-out both}
  @media (prefers-reduced-motion:reduce){
    .choice .verdict-stamp{animation:none}
    .outcome.slidein{animation:none}
  }
  .choice .cue{display:block; margin-top:4px; font-size:.82rem; font-style:italic; color:var(--ink-soft)}
  /* Forecast chips on posture buttons: the fortnight's net swing, shown before
     committing. Same chip language as outcomes, slightly quieter. */
  .choice .fore{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
  .choice .fore .delta{font-size:.66rem; padding:1px 6px; opacity:.85}
  .outcome{font-style:italic; margin:15px 0 6px; color:var(--ink-soft)}
  .deltas{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px}
  .delta{font-family:"Courier New",Courier,monospace; font-size:.72rem; padding:2px 8px; border-radius:2px; background:var(--surface2); font-variant-numeric:tabular-nums}
  .delta.up{color:var(--good); border:1px solid var(--good)}
  .delta.down{color:var(--bad); border:1px solid var(--bad)}
  /* Consultation: a word in your ear before you decide. The ask is a quiet
     dotted control; the answer a pencilled marginal note pinned above the choices. */
  .consult{margin:0 0 15px}
  button.consult-ask{
    font-family:inherit; font-size:.86rem; font-style:italic; color:var(--indigo);
    background:none; border:none; border-bottom:1px dotted var(--indigo);
    padding:0 0 1px; cursor:pointer;
  }
  button.consult-ask:hover{color:var(--ink); border-bottom-color:var(--ink)}
  button.consult-ask:focus-visible{outline:2px solid var(--indigo); outline-offset:3px}
  button.consult-ask[disabled]{opacity:.5; cursor:default}
  .consult-note{border-left:2px solid var(--line); padding:2px 0 2px 12px; margin:2px 0 2px 3px}
  .consult-who{
    font-family:"Courier New",Courier,monospace; font-size:.62rem; letter-spacing:.07em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px;
  }
  .consult-op{font-style:italic; font-size:.95rem; color:var(--ink-soft)}
  .consult-note .deltas{margin-top:8px}
  .next{margin-top:16px; text-align:right}
  button.primary{
    font-family:"Courier New",Courier,monospace; font-size:.82rem; letter-spacing:.06em;
    text-transform:uppercase; background:var(--seal); color:var(--surface);
    border:none; border-radius:4px; padding:11px 20px; cursor:pointer;
  }
  button.primary:hover{filter:brightness(1.08)}
  button.primary:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}

  .ending{text-align:center}
  .ending .medal{display:block; width:148px; max-width:48%; height:auto; margin:8px auto 4px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.22))}
  .ending .cardtitle{font-size:1.7rem; margin-top:6px}
  .ending .verdict{font-style:italic; margin:14px auto; max-width:52ch}
  /* Arc codas and the service record share the boxed, expandable disclosure
     look — two sections of the closed file, opened only where you're curious. */
  .ending .record{
    text-align:left; max-width:52ch; margin:22px auto 6px; padding:14px 16px;
    background:var(--surface2); border:1px solid var(--line); border-radius:4px;
  }
  .record-head{
    font-family:"Courier New",Courier,monospace; font-size:.62rem; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; text-align:center;
  }
  /* Each turning point is an expandable row: a bold headline that opens to the
     choice made and its consequence. */
  .rec{border-top:1px dotted var(--line)}
  .rec:first-of-type{border-top:none}
  .rec > summary{
    list-style:none; cursor:pointer; padding:10px 4px 10px 22px; position:relative;
  }
  .rec > summary::-webkit-details-marker{display:none}
  .rec > summary::before{
    content:"\25B8"; position:absolute; left:4px; top:10px; color:var(--seal);
    transition:transform .15s; font-size:.8rem;
  }
  .rec[open] > summary::before{transform:rotate(90deg)}
  .rec > summary:focus-visible{outline:2px solid var(--indigo); outline-offset:2px; border-radius:3px}
  .rec > summary:hover .rec-what{color:var(--seal)}
  .rec-when{display:block; font-family:"Courier New",Courier,monospace; font-size:.6rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft)}
  .rec-what{display:block; font-weight:600; color:var(--seal-ink); font-size:.98rem; margin-top:1px}
  .rec-body{padding:0 4px 12px 22px}
  .rec-did{font-weight:600; font-size:.9rem; color:var(--ink)}
  .rec-out{font-style:italic; font-size:.9rem; color:var(--ink-soft); margin-top:5px}
  /* The disposition strip on the ending card: promoted, or serve it again. */
  .disposition{
    max-width:56ch; margin:10px auto 4px; padding:8px 14px; font-size:.92rem;
    border:1px solid var(--line); border-radius:4px; background:var(--surface2);
  }
  .disposition--up{border-color:var(--seal); color:var(--seal-ink)}
  .disposition--again{color:var(--ink-soft)}
  /* The career ladder on the start screen: the ranks in order, what each
     plays for, and where this career stands. Planned ranks render dimmed. */
  .ladder{
    max-width:52ch; margin:0 auto 14px; padding:10px 16px; text-align:left;
    background:var(--surface2); border:1px solid var(--line); border-radius:4px;
  }
  .ladder .record-head{margin-bottom:8px; text-align:center}
  .rung{padding:3px 0; font-size:.88rem; color:var(--ink-soft)}
  .rung-rank{font-weight:600; color:var(--ink)}
  .rung-plays{display:block; font-size:.8rem; font-style:italic; margin-left:1.35em}
  .rung--here .rung-rank{color:var(--seal)}
  .rung--planned{opacity:.55}
  /* Playable rungs are the chapter picker. */
  .rung--pick{cursor:pointer; border-radius:3px; margin:0 -6px; padding-left:6px; padding-right:6px}
  .rung--pick:hover, .rung--pick:focus-visible{background:var(--surface); outline:none}
  .rung--pick:hover .rung-rank{color:var(--seal)}
  .rung--pick:focus-visible{outline:2px solid var(--indigo); outline-offset:1px}
  .rung--pick u{text-decoration-color:var(--seal); text-underline-offset:2px}
  /* The service record on the start screen: rank, postings, honours so far. */
  .service{
    max-width:52ch; margin:0 auto 18px; padding:10px 16px; text-align:center;
    background:var(--surface2); border:1px solid var(--line); border-radius:4px;
  }
  .service .record-head{margin-bottom:6px}
  .service-line{font-size:.88rem; color:var(--ink-soft)}
  .service-line:first-of-type{color:var(--ink); font-weight:600}
  /* Start-screen actions: primary + a quiet secondary for New posting. */
  .start-actions{display:flex; flex-direction:column; align-items:center; gap:10px}
  button.ghost{
    font-family:"Courier New",Courier,monospace; font-size:.72rem; letter-spacing:.05em;
    text-transform:uppercase; background:none; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:4px; padding:8px 16px; cursor:pointer;
  }
  button.ghost:hover{border-color:var(--seal); color:var(--seal)}
  button.ghost:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}

  /* The Gazette: the career's collection, read from the persistent record. */
  .gazette{max-width:60ch; margin:0 auto; text-align:left}
  .gz-masthead{text-align:center; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid var(--line)}
  .gz-strap{font-style:italic; font-size:.86rem; color:var(--ink-soft); margin-top:2px}
  .gz-empty{font-style:italic; color:var(--ink-soft); text-align:center; margin-bottom:18px; text-wrap:balance}
  .gz-rank{margin-bottom:20px; padding-bottom:14px; border-bottom:1px dotted var(--line)}
  .gz-rank-head{font-weight:700; font-size:1.05rem; color:var(--ink); margin-bottom:6px}
  .gz-cabinet{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
  .gz-medal{
    font-family:"Courier New",Courier,monospace; font-size:.72rem; letter-spacing:.03em;
    color:var(--seal-ink); border:1px solid var(--seal); border-radius:2px; padding:2px 8px;
  }
  .gz-none{font-style:italic; font-size:.82rem; color:var(--ink-soft)}
  .gz-sub{
    font-family:"Courier New",Courier,monospace; font-size:.6rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-soft); margin:10px 0 5px;
  }
  .gz-fates{list-style:none; padding:0; margin:0}
  .gz-fates li{font-size:.9rem; color:var(--ink); padding:1px 0}
  .gz-fates li.gz-none{color:var(--ink-soft)}
  .gz-blank{height:0; border-bottom:1px dotted var(--line-soft); margin:9px 18px 9px 0; opacity:.6}

  footer{text-align:center; font-family:"Courier New",Courier,monospace; font-size:.64rem; letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase; margin-top:24px}
  /* Wide screens: two columns — the situation (scene + stats) on the left, the
     decision on the right — so a fortnight reads without scrolling. Below the
     break it collapses back to the single stacked column. */
  @media (min-width:960px){
    .frame{max-width:1040px}
    #game:not([hidden]){display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:start}
    .col{min-width:0}
    .col-left .economy{border-bottom:none; padding-bottom:0; margin-bottom:0}
    .start{max-width:660px; margin-left:auto; margin-right:auto}
  }
  /* The sticky meter strip: on the phone the full meters scroll away with the
     left column, so a slim compact strip of the five values pins to the top
     while you read the card. Desktop hides it (the meters sit in view there). */
  .meterstrip{display:none}
  @media (max-width:959px){
    .meterstrip{
      display:flex; position:sticky; top:0; z-index:20; gap:5px;
      background:var(--bg); border-bottom:1px solid var(--line);
      padding:6px 4px; margin:0 0 12px;
    }
    .ms-cell{flex:1 1 0; min-width:0; text-align:center}
    .ms-name{font-family:"Courier New",Courier,monospace; font-size:.5rem; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft)}
    .ms-val{font-size:.92rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2}
    .ms-cell.danger .ms-val{color:var(--bad)}
  }
  @media (max-width:440px){ .meter .name{font-size:.5rem} .card{padding:18px 16px} }
  /* The season owns the page: a fixed wash tinting the whole view by season —
     the cold weather cool and clear, the hot weather amber and hard, the
     monsoon darkened, with faint rain drawn across the margins. Translucent, so
     it reads over both the light and the dark paper. Content sits above it. */
  .seasonwash{position:fixed; inset:0; pointer-events:none; z-index:0; transition:background-color 1s ease; background-color:transparent}
  .frame{position:relative; z-index:1}
  [data-season="cold"] .seasonwash{background-color:rgba(120,150,195,.05)}
  [data-season="hot"] .seasonwash{background-color:rgba(214,158,66,.07)}
  [data-season="monsoon"] .seasonwash{background-color:rgba(58,78,70,.11)}
  [data-season="monsoon"] .seasonwash::after{
    content:""; position:absolute; inset:-25% 0;
    background:repeating-linear-gradient(103deg, transparent 0 21px, rgba(180,198,210,.05) 21px 22px);
    animation:rain .7s linear infinite;
  }
  @keyframes rain{from{transform:translateY(-44px)} to{transform:translateY(44px)}}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} button.choice:hover{transform:none} [data-season="monsoon"] .seasonwash::after{display:none} }
</style>
</head>
<body>
<div class="seasonwash" id="seasonwash" aria-hidden="true"></div>
<div class="frame">
  <header class="masthead">
    <div class="cover-stamp" aria-hidden="true">Most Secret</div>
    <img class="crest" id="crest" hidden alt="Indian Civil Service seal">
    <svg class="seal-svg" id="seal-fallback" viewBox="0 0 100 100" role="img" aria-label="Indian Civil Service seal" xmlns="http://www.w3.org/2000/svg">

      <circle cx="50" cy="50" r="45.3" fill="none" stroke="var(--seal)" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="0 6.469"/>
      <polygon points="50.00,11.00 54.14,34.55 69.50,16.23 61.31,38.69 83.77,30.50 65.45,45.86 89.00,50.00 65.45,54.14 83.77,69.50 61.31,61.31 69.50,83.77 54.14,65.45 50.00,89.00 45.86,65.45 30.50,83.77 38.69,61.31 16.23,69.50 34.55,54.14 11.00,50.00 34.55,45.86 16.23,30.50 38.69,38.69 30.50,16.23 45.86,34.55" fill="none" stroke="var(--seal)" stroke-width="1.15" stroke-linejoin="round"/>
      <polygon points="57.76,21.02 56.50,38.74 71.21,28.79 61.26,43.50 78.98,42.24 63.00,50.00 78.98,57.76 61.26,56.50 71.21,71.21 56.50,61.26 57.76,78.98 50.00,63.00 42.24,78.98 43.50,61.26 28.79,71.21 38.74,56.50 21.02,57.76 37.00,50.00 21.02,42.24 38.74,43.50 28.79,28.79 43.50,38.74 42.24,21.02 50.00,37.00" fill="none" stroke="var(--indigo)" stroke-width="0.7" stroke-linejoin="round" opacity="0.85"/>
      <circle cx="50" cy="50" r="12.4" fill="var(--indigo)"/>
      <circle cx="50" cy="50" r="12.4" fill="none" stroke="var(--seal)" stroke-width="1"/>
      <path d="M50 57.4 C45.6 53.4 46.6 48.6 50 43.2 C53.4 48.6 54.4 53.4 50 57.4 Z" fill="var(--surface)"/>
      <path d="M50 55 C47.8 52.6 48.4 49.7 50 46.4 C51.6 49.7 52.2 52.6 50 55 Z" fill="var(--seal)" opacity="0.85"/>
    </svg>
    <div class="mast-text">
      <div class="dept">Government of India &middot; Political &amp; Secret Department</div>
      <h1>Pukka Sahib</h1>
      <div class="sub" id="mastsub">Private despatches of the District Magistrate &amp; Collector, Chhota Nagra</div>
    </div>
    <button type="button" class="audiobtn off" id="audiotoggle" aria-pressed="false" aria-label="Sound off" title="Sound off">
      <span class="ico" aria-hidden="true">&#9834;</span>
    </button>
  </header>
  <hr class="rule">

  <div class="start" id="start" hidden></div>

  <div id="game" hidden>
    <div class="meterstrip" id="meterstrip" aria-hidden="true"></div>
    <div class="col col-left">
      <img class="scene" id="scene" decoding="async" alt="" hidden>
      <div class="seasonband" id="seasonband"></div>
      <div class="meters" id="meters"></div>
      <button type="button" class="meterkey" id="meterkey" aria-controls="legend">What do these mean?</button>
      <ul class="legend" id="legend" hidden></ul>
      <div class="honours" id="honours"></div>
      <div class="economy" id="economy"></div>
      <div class="standings" id="standings" hidden></div>
    </div>
    <div class="col col-right">
      <div class="yearstrip" id="yearstrip" hidden></div>
      <div class="notice" id="notice" hidden></div>
      <div class="card" id="card"></div>
    </div>
  </div>

  <footer>One fortnight per turn &middot; survive the posting</footer>
</div>

</body>
</html>
