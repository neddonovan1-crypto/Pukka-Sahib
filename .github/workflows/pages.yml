name: Deploy to GitHub Pages

# Publishes the multi-file dist/ build to GitHub Pages. The private claude.ai
# Artifact keeps shipping from the single-file index.html; this is the public,
# external-asset-friendly target. Runs the fast (dependency-free) verify steps
# before deploying — the e2e/browser link stays local.

on:
  push:
    branches: ["claude/pukka-sahib-game-design-b8b0du"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate content
        run: node test/validate.js
      - name: Simulate (balance bands)
        run: node test/simulate.js
      - name: Build
        run: node build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
