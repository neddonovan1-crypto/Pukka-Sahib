<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pukka Sahib — the first fortnight</title>
<style>
/* ==========================================================================
   The desk, and the road.

   Two environments that must not look alike (docs/DESIGN-DESK.md §5): the desk
   is enclosed timber and lamplight with nothing scrolling; the road is open
   country in daylight, and the only place the player's own hand appears.
   ========================================================================== */
:root{
  --paper:#e6dbbe; --paper2:#efe6cd; --flimsy:#e4dde0;
  --ink:#221c12; --soft:#5f5540; --rule:#b9a373; --hair:rgba(92,80,58,.5);
  --seal:#8f2f22; --violet:#463a72; --indigo:#2a3550;
  --good:#4a6b3f; --warn:#977326; --bad:#8f2f22;
  --timber:#3b3226;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  color:var(--ink); overflow:hidden; height:100%;
}
#app{position:fixed; inset:0; overflow:hidden}
button{font-family:inherit; cursor:pointer}
button:disabled{opacity:.34; cursor:default}

/* ——————————————————————————————————————————————————————————— THE DESK —— */
/* The room is a photograph now, not a gradient: teak, a green leather blotter
   with gilt tooling, the lamp, the stamps in their rack. The interface lays
   itself over that, and the paper in hand lands on the actual blotter. */
/* The painting is shown whole, not cropped, so everything laid over it —
   the sheet on the blotter, the survey plate in the frame — lands where the
   painter put it. */
.scene-desk{position:relative; background:#140f09; display:flex;
  align-items:center; justify-content:center}
.room{position:relative; width:100%; max-width:calc(100vh * 16 / 9);
  aspect-ratio:16/9; box-shadow:0 0 90px rgba(0,0,0,.75)}
.roomart{position:absolute; inset:0; width:100%; height:100%; display:block}
.onwall,.onblotter,.onrack{position:absolute}
.onwall{overflow:hidden}
.wallmap{position:absolute; left:8%; top:9%; width:84%; height:82%; display:block;
  object-fit:cover; object-position:50% 50%; mix-blend-mode:multiply;
  box-shadow:inset 0 0 18px rgba(60,40,15,.4), 0 1px 4px rgba(0,0,0,.5)}
.wallbtn{position:absolute; inset:0; background:none; border:0}
.wallbtn:hover{background:rgba(255,238,190,.14); box-shadow:inset 0 0 0 2px rgba(143,47,34,.5)}
.onblotter{display:flex; align-items:center; justify-content:center}
/* the punkah, still turning over the room */
.scene-desk::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(101deg, transparent 34%, rgba(0,0,0,.13) 46%, transparent 58%);
  animation:punkah 7.5s ease-in-out infinite alternate;
}
@keyframes punkah{ from{transform:translateX(-4%)} to{transform:translateX(4%)} }
@media (prefers-reduced-motion:reduce){ .scene-desk::after{animation:none} }

 /* The room is a painting; the chrome must not bury it. Only the date and the
    days stay on screen — the ledger is Simla's opinion and arrives by post. */
 /* the date and the days only, and they must not intercept the tape below */
.deskrail{
  pointer-events:none;
  position:absolute; left:0; top:0; z-index:3; width:186px;
  padding:12px 14px 16px; display:flex; flex-direction:column; gap:10px;
  background:radial-gradient(120% 100% at 0% 0%, rgba(12,8,4,.8), rgba(12,8,4,0) 78%);
}
.ledger{display:none}
.whoami{color:#efe1bd; text-shadow:0 1px 3px rgba(0,0,0,.9)}
.whoami b{display:block; font-size:1.08rem}
.whoami span{display:block; font-family:"Courier New",monospace; font-size:.53rem;
  letter-spacing:.13em; text-transform:uppercase; color:#c2b18a; margin-top:2px}
.whoami .szn{margin-top:5px; color:#a2957a}

.daybox,.ledger{border:1px solid rgba(201,180,130,.28); background:rgba(8,6,3,.5); padding:8px 10px}
.dlabel{font-family:"Courier New",monospace; font-size:.52rem; letter-spacing:.15em;
  text-transform:uppercase; color:#b3a punkt}
.dlabel{color:#b3a display}
.dlabel{color:#b3a483}
.dmarks{display:flex; gap:2.5px; margin:6px 0 4px}
.dmarks i{flex:1 1 0; height:12px; background:#dcccA0; border-radius:1px}
.dmarks i{background:#dccca0}
.dmarks i.spent{background:rgba(220,204,160,.14)}
.dnum{font-size:1.4rem; color:#efe1bd; font-variant-numeric:tabular-nums}
.dnum span{font-size:.62rem; color:#9c8f72; font-family:"Courier New",monospace}
.gauge{display:flex; align-items:center; gap:6px; margin:3px 0}
.gname{flex:0 0 70px; font-family:"Courier New",monospace; font-size:.5rem;
  letter-spacing:.09em; text-transform:uppercase; color:#b3a483}
.gbar{flex:1 1 auto; height:4px; background:rgba(220,204,160,.15); position:relative}
.gbar i{position:absolute; inset:0 auto 0 0; background:#cbb684; transition:width .5s ease}
.gval{flex:0 0 20px; text-align:right; font-size:.72rem; color:#efe1bd; font-variant-numeric:tabular-nums}

.mapbtn{
  margin-top:auto;
}
.seasonnote{display:none}
.mapbtn canvas{width:100%; height:auto; display:block; margin:4px 0 2px}
.mlbl{font-family:"Courier New",monospace; font-size:.56rem; letter-spacing:.15em;
  text-transform:uppercase; color:#5f5540}
.mnote{position:absolute; right:8px; top:7px; font-family:"Courier New",monospace;
  font-size:.5rem; letter-spacing:.11em; text-transform:uppercase; color:var(--seal)}

.deskmain{position:absolute; inset:0; z-index:2; pointer-events:none}
.deskmain > *{pointer-events:auto}

/* ——— the tape ————————————————————————————————————————————————————
   The fortnight strung across the top, the way a file was actually strung.
   Titles readable without opening anything; what is left is still hanging
   there when the fortnight closes. */
 /* Strung down the left wall, where the plaster is quiet, rather than across
    the ceiling where it cut the punkah in half. */
.tapewrap{position:absolute; left:14px; top:170px; bottom:88px; width:216px;
  display:flex; flex-direction:column}
.tape{position:absolute; left:16px; top:0; bottom:34px; width:5px;
  background:linear-gradient(90deg, #5d1712, #a8332a 45%, #7d211a);
  box-shadow:2px 0 5px rgba(0,0,0,.6)}
.hangers{position:relative; display:flex; flex-direction:column; gap:7px;
  padding-left:26px; overflow-y:auto; flex:1 1 auto}
.hung{
  position:relative; margin-left:var(--drop); transform:rotate(var(--lean));
  transform-origin:-14px 50%; background:var(--paper); border:0;
  border-right:2px solid rgba(92,80,58,.5); text-align:left;
  padding:6px 10px 5px; width:100%; overflow:hidden;
  box-shadow:-2px 6px 14px -8px rgba(0,0,0,.9);
  transition:transform .16s cubic-bezier(.3,1.3,.5,1), margin-left .16s;
}
 /* the tie runs from the tape itself to the paper — 26px of padding, less the
    5px tape, plus however far this sheet hangs out */
.hung .tie{position:absolute; left:calc(-1 * var(--drop) - 21px); top:50%;
  height:2.5px; width:calc(var(--drop) + 21px); margin-top:-1px;
  background:linear-gradient(90deg, #7d211a, #b03a2c 60%, #8d2a22);
  box-shadow:0 1px 2px rgba(0,0,0,.5)}
.hung .tie::after{content:""; position:absolute; right:-1px; top:-2.5px;
  width:7px; height:7px; border-radius:50%; background:#8d2a22;
  box-shadow:0 1px 2px rgba(0,0,0,.55)}
.hung .ttl{display:block; font-size:.68rem; color:var(--soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hung--telegram{background:var(--flimsy)} .hung--petition{background:#e8dcc0}
.hung .dot{position:absolute; right:4px; top:4px; width:5px; height:5px;
  border-radius:50%; background:var(--seal)}
.hung:hover{margin-left:calc(var(--drop) + 6px); transform:rotate(0deg)}
 /* Taken down: the paper is on the blotter, so the tape shows the gap it left
    — the tie still knotted, and nothing hanging on it but a name. */
.hung.down{margin-left:calc(var(--drop) + 12px); transform:rotate(0deg);
  background:rgba(30,22,12,.28); box-shadow:none;
  border:1px dashed rgba(214,196,152,.5); border-right-width:1px}
.hung.down .ttl{color:#d6c498; font-style:italic}
.hung.down .tie{opacity:.6}
.trayempty{font-family:"Courier New",monospace; font-size:.58rem; letter-spacing:.13em;
  text-transform:uppercase; color:#cbbb96; text-shadow:0 1px 4px rgba(0,0,0,.9);
  padding-top:14px}
.trayacts{display:flex; flex-direction:column; gap:6px; margin-top:10px; padding-left:30px}
/* a paper left hanging yellows, then curls, then rusts at the tie */
.hung.aged{filter:sepia(.22) saturate(.9)}
.hung.aged--2{filter:sepia(.4) saturate(.82) brightness(.96)}
.hung.aged--3{filter:sepia(.55) saturate(.75) brightness(.92)}
.hung .age{position:absolute; right:4px; bottom:3px; font-style:normal;
  font-family:"Courier New",monospace; font-size:.46rem; color:var(--seal); opacity:.8}
.hung.aged .tie{background:linear-gradient(90deg, #6b3a1e, #8a5a2e)}
.delegate,.endfn,.putback{
  font-family:"Courier New",monospace; font-size:.54rem; letter-spacing:.12em;
  text-transform:uppercase; background:rgba(10,7,4,.5);
  border:1px solid rgba(201,180,130,.4); color:#dfd0ab; padding:6px 10px;
}
.endfn{border-color:rgba(190,90,70,.65); color:#e6a493}
.putback{align-self:center; border-color:rgba(201,180,130,.3)}

/* ——— the out-tray, filling ——— */
.outtray{position:absolute; right:16px; bottom:14px; width:150px; text-align:center}
.olbl,.ocount{display:block; font-family:"Courier New",monospace; font-size:.5rem;
  letter-spacing:.14em; text-transform:uppercase; color:#d8c8a2;
  text-shadow:0 1px 4px rgba(0,0,0,.95)}
.opile{position:relative; height:52px; margin:5px 0 3px}
.osheet{position:absolute; left:8%; right:8%; height:9px; bottom:calc(var(--i) * 5px);
  background:var(--paper); border-bottom:1px solid rgba(92,80,58,.5);
  transform:rotate(calc((var(--i) - 4) * .5deg));
  box-shadow:0 2px 5px -2px rgba(0,0,0,.8);
  animation:drop .3s ease}
.osheet--telegram{background:var(--flimsy)} .osheet--petition{background:#e8dcc0}
 /* Only the sheet that has just arrived is seen to arrive; the rest of the
    pile is not re-dealt every time the desk repaints. */
.osheet.fresh{animation:settle .34s cubic-bezier(.24,1.3,.4,1) both}
@keyframes settle{
  0%{transform:translateY(-26px) rotate(7deg) scale(1.07); opacity:.25}
  100%{transform:rotate(calc((var(--i) - 4) * .5deg)); opacity:1}
}
 /* and the pile takes it — the stack gives, very slightly, under the weight */
.opile.taking{animation:take .3s cubic-bezier(.3,0,.3,1); transform-origin:50% 100%}
@keyframes take{34%{transform:translateY(1.5px) scaleY(.955)}}

/* the paper in hand */
.hand{position:absolute; inset:-46% -3% 26%;
  display:flex; align-items:center; justify-content:center; pointer-events:none}
.nothing{font-family:"Courier New",monospace; font-size:.6rem; letter-spacing:.13em;
  text-transform:uppercase; color:#cbbb96; text-shadow:0 1px 4px rgba(0,0,0,.95)}
 /* The sheet. paper.css in this directory is a far richer treatment — deckle
    edges, punch holes threaded with tape, type impressed into the stock — but
    it was authored against a flat harness and its layers sit below the room
    when laid over the painting. Integrating it properly is its own pass. */
.hand .paper{
  width:92%; position:relative; z-index:0; isolation:isolate;
  background:var(--paper); padding:18px 88px 26px 24px;
  background-image:radial-gradient(rgba(120,95,45,.09) 1px,transparent 1.4px);
  background-size:4px 4px; transform:rotate(-.4deg);
  box-shadow:0 10px 22px -10px rgba(0,0,0,.9), 0 2px 3px rgba(0,0,0,.45);
  animation:land .34s cubic-bezier(.2,.9,.3,1);
}
 /* When the sheet's arrival or departure is being flown by motion.js, the CSS
    land must stand down — two things cannot own one transform. */
.hand .paper.flown{animation:none!important}
@keyframes land{from{opacity:0; transform:translateY(-14px) rotate(1.4deg)} to{opacity:1; transform:rotate(-.4deg)}}
.hand .paper--telegram{background-color:var(--flimsy)}
.hand .paper--petition{background-color:#e8dcc0}
.hand .paper::before{content:""; position:absolute; left:10px; top:26px; width:8px; height:8px;
  border-radius:50%; background:#2b3327; box-shadow:0 72px 0 #2b3327, inset 0 1px 2px rgba(0,0,0,.7)}
.hand .phead{display:flex; justify-content:space-between; gap:14px;
  border-bottom:1px solid var(--rule); padding-bottom:6px; margin-bottom:11px;
  font-family:"Courier New",monospace; font-size:.55rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--soft)}
.hand .pbody{font-size:1rem; line-height:1.6; max-width:52ch}
.hand .paper--telegram .pbody{font-family:"Courier New",monospace; font-size:.8rem;
  line-height:1.9; letter-spacing:.03em}
.hand .urgent,.hand .secret{
  position:absolute; right:14px; top:-12px; font-family:"Courier New",monospace;
  font-size:.53rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--seal); border:1.8px solid var(--seal); padding:3px 7px; transform:rotate(-7deg)}
.hand .secret{color:var(--violet); border-color:var(--violet)}
.hand .feestamp{position:absolute; right:18px; bottom:12px; width:56px; text-align:center}
.hand .feestamp img{width:100%; display:block}
.hand .feestamp b,.hand .feestamp em{position:absolute; left:0; right:0; font-style:normal;
  font-weight:600; text-transform:uppercase; color:#2f5d3f; letter-spacing:.09em}
.hand .feestamp b{top:40%; font-size:.36rem}
.hand .feestamp em{top:55%; font-size:.5rem}

/* the rack, along the front edge of the desk */
 /* The stamps lift out of the rack the painter put on the desk, and drop back
    when the paper leaves. Nothing crosses the blotter. */
.onrack{display:flex; align-items:flex-end; justify-content:center; pointer-events:none}
.rack{flex-wrap:nowrap}
.onrack.up{pointer-events:auto}
.rack{display:flex; gap:2px; align-items:flex-end; justify-content:center;
  transform:translateY(34%) scale(.7); opacity:0; transform-origin:50% 100%;
  transition:transform .3s cubic-bezier(.3,1.25,.5,1), opacity .2s}
.onrack.up .rack{transform:none; opacity:1}
.rack .stamp{width:54px; margin:0 -7px}
.rack .stamp:hover{z-index:4}
.putback{position:absolute; left:50%; bottom:-30px; transform:translateX(-50%); white-space:nowrap}
@media (prefers-reduced-motion:reduce){ .rack{transition:none} }

 /* What each stamp MEANS — the vocabulary, not the consequence. The game will
    not tell you what a decision will cost; it must tell you what the act is. */
.gloss{position:absolute; left:50%; bottom:118px; transform:translateX(-50%);
  width:min(430px,52%); text-align:center; padding:9px 14px 10px;
  background:rgba(10,7,4,.82); border:1px solid rgba(201,180,130,.3);
  opacity:0; transition:opacity .14s; pointer-events:none}
.gloss.on{opacity:1}
.gloss b{font-family:"Courier New",monospace; font-size:.6rem; font-weight:700;
  letter-spacing:.15em; text-transform:uppercase; color:#e6b7a6}
.gloss em{font-style:normal; font-family:"Courier New",monospace; font-size:.5rem;
  letter-spacing:.1em; text-transform:uppercase; color:#9c8f72; margin-left:8px}
.gloss span{display:block; margin-top:5px; font-size:.86rem; line-height:1.45; color:#e4d8b8}
.stamp.spent{filter:grayscale(.7) brightness(.7)}

/* ——— weather ————————————————————————————————————————————————————
   The plates are still, so the room breathes over the top of them: motes in
   the cold light, a shimmer at midday, rain in the monsoon. Layered art will
   replace this; the intent is recorded in DESIGN-ART.md §7. */
.weather{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:1}
.weather i{position:absolute; inset:0; display:block}
.weather--cold i:nth-child(1){
  background-image:radial-gradient(rgba(255,242,205,.5) 1px, transparent 1.6px);
  background-size:190px 150px; opacity:.5; animation:drift 34s linear infinite}
.weather--cold i:nth-child(2){
  background-image:radial-gradient(rgba(255,246,220,.4) 1.4px, transparent 2px);
  background-size:120px 240px; opacity:.35; animation:drift 52s linear infinite reverse}
@keyframes drift{to{transform:translate3d(-190px, -150px, 0)}}

.weather--hot i:nth-child(1){
  background:linear-gradient(105deg, transparent 30%, rgba(255,246,214,.16) 50%, transparent 70%);
  animation:shimmer 9s ease-in-out infinite alternate}
.weather--hot i:nth-child(2){
  background-image:radial-gradient(rgba(210,190,150,.5) 1px, transparent 1.7px);
  background-size:150px 220px; opacity:.4; animation:drift 60s linear infinite}
@keyframes shimmer{from{transform:translateX(-3%) scaleY(1)} to{transform:translateX(3%) scaleY(1.004)}}

.weather--monsoon i:nth-child(1){
  background-image:repeating-linear-gradient(76deg,
    rgba(226,236,240,.30) 0 1px, transparent 1px 9px);
  animation:rain .55s linear infinite}
.weather--monsoon i:nth-child(2){
  background-image:repeating-linear-gradient(72deg,
    rgba(226,236,240,.18) 0 1.4px, transparent 1.4px 15px);
  animation:rain .9s linear infinite}
.weather--monsoon i:nth-child(3){
  background:radial-gradient(120% 60% at 50% 0%, rgba(150,175,180,.16), transparent 70%);
  animation:gust 13s ease-in-out infinite alternate}
@keyframes rain{to{transform:translate3d(-40px, 160px, 0)}}
@keyframes gust{from{opacity:.4} to{opacity:.85}}

.weather--night i:nth-child(1){
  background:radial-gradient(30% 34% at 62% 74%, rgba(255,206,120,.16), transparent 70%);
  animation:flicker 4.5s ease-in-out infinite alternate}
@keyframes flicker{0%{opacity:.55} 40%{opacity:.9} 60%{opacity:.7} 100%{opacity:1}}
@media (prefers-reduced-motion:reduce){ .weather i{animation:none!important} }

/* the mark the die leaves.
   It is appended at the instant of contact, not before, so it has no travel of
   its own — only the bloom of ink spreading out from under the rubber. */
.struckmark{
  position:absolute; left:50%; top:52%; transform:translate(-50%,-50%) rotate(var(--turn)) scale(1);
  font-family:"Iowan Old Style",Palatino,Georgia,serif; font-weight:700;
  font-size:.84rem; letter-spacing:.11em; text-transform:uppercase;
  color:rgba(143,47,34,.9); border:2.4px solid rgba(143,47,34,.85);
  padding:4px 9px; opacity:0; pointer-events:none;
  animation:strike .2s cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes strike{
  0%{opacity:.15; transform:translate(-50%,-50%) rotate(var(--turn)) scale(1.14)}
  40%{opacity:1; transform:translate(-50%,-50%) rotate(var(--turn)) scale(.995)}
  100%{opacity:.88; transform:translate(-50%,-50%) rotate(var(--turn)) scale(1)}
}

/* ——— things in transit ————————————————————————————————————————————
   A copy of the object, laid over the room and flown by motion.js, so the
   room underneath can be repainted mid-journey without the player seeing a
   cut. The copy never takes a click and never outlives its flight. */
.flier{position:fixed; z-index:20; pointer-events:none; will-change:transform,opacity}
.flier > *{margin:0!important; transform:none!important; width:100%!important;
  transition:none!important; animation:none!important; box-shadow:none}
.flier.tab > *{box-shadow:0 14px 24px -10px rgba(0,0,0,.95)}
.flier.sheet > *{box-shadow:0 16px 30px -12px rgba(0,0,0,.95)}
.flier.die{transform-origin:50% 94%}
.flier.die > *{filter:none}
/* the pad, if the art for it exists at all */
.inkpad{position:absolute; z-index:1; display:block; pointer-events:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}

@media (prefers-reduced-motion:reduce){
  /* the whole choreography is skipped; only the end state arrives */
  .struckmark{animation:none; opacity:.88;
    transform:translate(-50%,-50%) rotate(var(--turn)) scale(1)}
  .hand .paper,.osheet.fresh,.opile.taking{animation:none}
}

/* the paper in hand */
.hand{display:flex; align-items:center; justify-content:center; overflow:hidden;
  min-height:0; position:relative}
.nothing{z-index:1}
.nothing{font-family:"Courier New",monospace; font-size:.62rem; letter-spacing:.14em;
  text-transform:uppercase; color:#8b7f63; align-self:center}
@keyframes land{from{opacity:0; transform:translateY(-16px) rotate(1.6deg)} to{opacity:1; transform:rotate(-.3deg)}}
.paper--telegram{background:var(--flimsy)}
.paper--petition{background:#e8dcc0}
.paper::before{content:""; position:absolute; left:11px; top:30px; width:8px; height:8px;
  border-radius:50%; background:#2b3327; box-shadow:0 84px 0 #2b3327, inset 0 1px 2px rgba(0,0,0,.7)}
.phead{display:flex; justify-content:space-between; gap:14px; border-bottom:1px solid var(--rule);
  padding-bottom:6px; margin-bottom:12px; font-family:"Courier New",monospace;
  font-size:.56rem; letter-spacing:.13em; text-transform:uppercase; color:var(--soft)}
.pbody{font-size:1.02rem; line-height:1.6; max-width:52ch}
.paper--telegram .pbody{font-family:"Courier New",monospace; font-size:.82rem;
  line-height:1.95; letter-spacing:.03em}
.urgent,.secret{
  position:absolute; right:20px; top:52px; font-family:"Courier New",monospace;
  font-size:.55rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
  color:var(--seal); border:1.8px solid var(--seal); padding:3px 7px; transform:rotate(-7deg);
}
.secret{color:var(--violet); border-color:var(--violet)}
.feestamp{position:absolute; right:22px; top:96px; width:74px; text-align:center}
.feestamp img{width:100%; display:block}
.feestamp b,.feestamp em{position:absolute; left:0; right:0; font-style:normal;
  font-family:"Iowan Old Style",Palatino,Georgia,serif; font-weight:600;
  text-transform:uppercase; color:#2f5d3f; letter-spacing:.1em}
.feestamp b{top:40%; font-size:.4rem}
.feestamp em{top:55%; font-size:.55rem}

/* the rack */
.rack{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding-top:2px}
 /* The rack: one die, photographed once, with each stamp's word set into the
    blank paper band around its shaft — the same trick as the postage and
    court-fee panels. Pressing one should feel like picking it up. */
.stamp{
  position:relative; width:96px; padding:0 0 16px; background:none; border:0;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.75));
  transform:rotate(var(--lean,0deg));
  transition:transform .12s cubic-bezier(.3,1.4,.5,1);
}
.stamp svg{width:100%; height:auto; display:block}
.stamp em{
  position:absolute; left:0; right:0; bottom:0; font-style:normal;
  font-family:"Courier New",monospace; font-size:.5rem; letter-spacing:.1em;
  color:#e2d3ae; text-shadow:0 1px 3px rgba(0,0,0,.95); text-align:center;
}
 /* Hovering brings a die half upright in its rack; the flight out starts from
    whatever lean it is standing at, so the lean is never thrown away. */
.stamp:not(:disabled):hover{transform:translateY(-7px) rotate(calc(var(--lean,0deg) * .35))}
.stamp:not(:disabled):active{transform:translateY(3px) scale(.96) rotate(var(--lean,0deg))}
.stamp--act .band{color:#243a5c}
.stamp--close .band{color:#5f5540}
.rack{align-items:flex-end}

/* delegation */
.modal{position:fixed; inset:0; background:rgba(10,7,4,.72); display:flex;
  align-items:center; justify-content:center; z-index:9}
.modalbox{background:var(--paper); padding:22px 24px; width:min(430px,92%); border:1px solid var(--hair)}
.modalbox h3{margin:0 0 4px; font-size:1.16rem}
.modalnote{margin:0 0 14px; font-size:.85rem; color:var(--soft); font-style:italic}
.clerk{display:block; width:100%; text-align:left; background:var(--paper2);
  border:1px solid var(--hair); border-left-width:4px; padding:9px 12px; margin-bottom:7px}
.clerk--good{border-left-color:var(--good)} .clerk--fair{border-left-color:var(--warn)}
.clerk--poor{border-left-color:var(--bad)}
.clerk b{display:block; font-size:.98rem}
.clerk span{display:block; font-family:"Courier New",monospace; font-size:.54rem;
  letter-spacing:.11em; text-transform:uppercase; color:var(--soft)}
.clerk em{display:block; font-size:.84rem; color:var(--soft); margin-top:3px}
.cancel{width:100%; background:none; border:1px solid var(--hair); padding:8px;
  font-family:"Courier New",monospace; font-size:.58rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--soft); margin-top:5px}

/* ——————————————————————————————————————————————————————————— THE ROAD —— */
/* Nothing here is shared with the desk: open sky instead of timber, daylight
   instead of a lamp, and the officer's own hand instead of a typewriter. */
.scene-road{
  position:fixed; inset:0; overflow:auto;
  background:#8d8259 url(../../art/web/camp-cold.jpg) center 40% / cover no-repeat fixed;
}
/* the camp is bright; the pages need something to sit against */
.sky{position:absolute; inset:0; background:linear-gradient(
  rgba(24,18,10,.34) 0%, rgba(24,18,10,.10) 34%, rgba(24,18,10,.46) 100%)}
.land{display:none}
.roadwrap,.diarywrap{position:relative; z-index:2; max-width:820px; margin:0 auto; padding:26px 20px 50px}
.roadhead b{display:block; font-size:1.6rem; color:#f6ecd2; text-shadow:0 2px 8px rgba(0,0,0,.9)}
.roadhead span{display:block; font-style:italic; color:#4c4staff}
.roadhead span{color:#e3d5b2; margin-top:2px; text-shadow:0 1px 6px rgba(0,0,0,.9)}
.mapbig{position:relative; display:inline-block; border:1px solid var(--hair); margin:16px 0 12px;
  box-shadow:0 16px 30px -20px rgba(0,0,0,.6)}
.mapbig{position:relative; display:inline-block; line-height:0}
.mapbig .plate{width:100%; height:auto; display:block}
.routeline{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.routeline path{fill:none; stroke:#8f2f22; stroke-width:.7; stroke-dasharray:2.4 1.8;
  vector-effect:non-scaling-stroke; opacity:.85}
.pin{position:absolute; transform:translate(-50%,-50%); background:none; border:0;
  padding:14px; line-height:1; text-align:center; white-space:nowrap}
.pin .hq{display:block; width:11px; height:11px; margin:0 auto; border-radius:50%;
  background:#efe7ce; border:2px solid #2a2317; box-shadow:0 1px 3px rgba(0,0,0,.5)}
.pin .pname{display:block; margin-top:5px; font-family:"Iowan Old Style",Palatino,Georgia,serif;
  font-weight:600; font-size:.78rem; letter-spacing:.09em; color:#2a2317;
  paint-order:stroke; -webkit-text-stroke:3.5px #efe7ce; text-shadow:0 0 4px #efe7ce}
.pin .pdays{display:block; font-family:"Courier New",monospace; font-size:.54rem;
  letter-spacing:.1em; text-transform:uppercase; color:#6a5f45; text-shadow:0 0 4px #efe7ce}
.pin.on .hq{background:#8f2f22; border-color:#8f2f22; box-shadow:0 0 0 4px rgba(143,47,34,.22)}
.pin.on .pname{color:#8f2f22}
.pin .pord{position:absolute; left:50%; top:-2px; margin-left:8px;
  font-family:"Courier New",monospace; font-size:.5rem; font-weight:700; color:#8f2f22}
.pin:hover .hq{border-color:#8f2f22}
.cartouche{position:absolute; right:3.5%; bottom:5%; background:rgba(239,231,206,.92);
  border:1.4px solid #2a2317; padding:7px 14px 6px; text-align:center; line-height:1.25}
.cartouche b{display:block; font-size:.86rem; letter-spacing:.06em}
.cartouche span{display:block; font-family:"Courier New",monospace; font-size:.5rem;
  letter-spacing:.2em; text-transform:uppercase; color:#6a5f45; margin-top:2px}
.stophit{position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px;
  border-radius:50%; background:none; border:1px solid transparent; padding:0}
.stophit:hover{border-color:rgba(143,47,34,.45); background:rgba(143,47,34,.07)}
.stophit.on{border-color:rgba(143,47,34,.7)}
.mapbig .dist{fill:url(#stipple); stroke:#2a2317; stroke-width:2}
.mapbig .bnd{fill:none; stroke:#2a2317; stroke-width:.7; stroke-dasharray:5 3 1 3; opacity:.75}
.mapbig .riv{fill:none; stroke:#5d7b8a; stroke-width:2.2}
.mapbig .rail{fill:none; stroke:#2a2317; stroke-width:1.4; stroke-dasharray:6 4}
.mapbig .hit{fill:transparent; cursor:pointer}
.mapbig .pip{fill:#efe7ce; stroke:#2a2317; stroke-width:1.4}
.mapbig text{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:6.4px;
  text-anchor:middle; fill:#2a2317; letter-spacing:.9px; pointer-events:none;
  paint-order:stroke; stroke:#efe7ce; stroke-width:2.4px}
.mapbig .dcost{font-family:"Courier New",monospace; font-size:4.6px; fill:#6a5f45; stroke-width:1.8px}
.mapbig .stop{cursor:pointer}
.mapbig .stop.on .pip{fill:var(--seal); stroke:var(--seal)}
.mapbig .stop.on text{fill:var(--seal); font-weight:700}
.roadfoot{display:flex; align-items:center; gap:12px}
.cost{flex:1 1 auto; font-family:"Courier New",monospace; font-size:.62rem;
  letter-spacing:.13em; text-transform:uppercase; color:#e8dbb8;
  text-shadow:0 1px 5px rgba(0,0,0,.9)}
.setout,.backdesk{font-family:"Courier New",monospace; font-size:.62rem; font-weight:700;
  letter-spacing:.15em; text-transform:uppercase; padding:10px 16px;
  border:2.2px solid var(--seal); color:var(--seal); background:rgba(255,252,240,.6)}
.backdesk{border-color:#e8dbb8; color:#e8dbb8; background:rgba(20,14,8,.6); font-weight:400}

/* the camp diary — the only place the player's own hand appears */
.diaryhead{font-family:"Courier New",monospace; font-size:.6rem; letter-spacing:.16em;
  text-transform:uppercase; color:#e8dbb8; text-shadow:0 1px 5px rgba(0,0,0,.9);
  margin-bottom:14px}
.page{display:flex; gap:16px; align-items:flex-start; margin:0 0 18px;
  background:rgba(244,238,216,.95); border:1px solid var(--hair); padding:14px;
  box-shadow:0 14px 26px -18px rgba(0,0,0,.6)}
.page img{width:230px; height:auto; flex:0 0 auto; border:1px solid rgba(120,95,45,.5)}
.page figcaption{flex:1 1 auto}
.page b{display:block; font-family:"Courier New",monospace; font-size:.58rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--soft); margin-bottom:6px}
.penned{font-family:"Segoe Script","Bradley Hand","Apple Chancery","Snell Roundhand",cursive;
  color:var(--indigo); font-size:1.06rem; line-height:1.8; display:block}

/* ————————————————————————————————————————————————————— THE RECKONING —— */
.scene-reck{
  position:fixed; inset:0; overflow:auto;
  background:#17110a url(../../art/web/desk-night.jpg) center 55% / cover no-repeat fixed;
}
.reck{background:linear-gradient(rgba(14,10,5,.84), rgba(14,10,5,.93))}
.reck{max-width:900px; margin:0 auto; padding:32px 22px 60px; color:#e6d9b6}
.reck h2{font-size:1.9rem; margin:0 0 18px}
.reckcols{display:grid; grid-template-columns:1.35fr 1fr; gap:26px; margin-bottom:22px}
.reck h3{font-family:"Courier New",monospace; font-size:.6rem; letter-spacing:.16em;
  text-transform:uppercase; color:#a8987a; margin:0 0 9px}
.dlist,.rlist{list-style:none; margin:0; padding:0; font-size:.9rem}
.dlist li{padding:7px 0; border-bottom:1px solid rgba(185,163,115,.2)}
.rlist li{padding:6px 0; border-bottom:1px solid rgba(143,47,34,.3); color:#d9bfae}
.st{display:inline-block; font-family:"Courier New",monospace; font-size:.5rem;
  font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#e0b9a8;
  border:1.4px solid rgba(224,185,168,.6); padding:1px 5px; margin-right:6px}
.oline{color:#bcae8e; font-style:italic}
.rotnote{font-style:italic; color:#d09a86; font-size:.9rem}
.again{display:block; margin:8px auto 0; background:none; border:2px solid #c9b482;
  color:#e6d9b6; font-family:"Courier New",monospace; font-size:.64rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; padding:11px 20px}
.scene-reck .ledger{border-color:rgba(185,163,115,.3); margin-bottom:20px}

@media (max-width:820px){
  .scene-desk{grid-template-columns:1fr; grid-template-rows:auto 1fr}
  .deskrail{flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px}
  .ledger{flex:1 1 240px} .daybox{flex:1 1 180px} .mapbtn{margin:0; flex:0 0 130px}
  .reckcols{grid-template-columns:1fr}
  .page{flex-direction:column} .page img{width:100%}
}
</style>
</head>

<div id="app"></div>
<script src="scenes.js"></script>
<script src="content.js"></script>
<script src="mapdraw.js"></script>
<script src="furniture.js"></script>
<script src="motion.js"></script>
<script src="desk.js"></script>
</body>
